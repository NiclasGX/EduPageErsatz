name: Stundenplan bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Xcode anzeigen
        run: xcodebuild -version

      - name: Swift anzeigen
        run: swift --version

      - name: App bauen
        run: |
          xcodebuild \
            -scheme "Stundenplan" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
