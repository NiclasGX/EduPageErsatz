name: Stundenplan bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Xcode anzeigen
        run: xcodebuild -version

      - name: App bauen
        run: |
          xcodebuild \
            -scheme "Stundenplan" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: App suchen
        run: |
          echo "Suche nach der gebauten App..."
          find . -name "*.app" -type d -print

      - name: App als IPA verpacken
        run: |
          APP_PATH=$(find . -name "Stundenplan.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "FEHLER: Stundenplan.app wurde nicht gefunden!"
            exit 1
          fi

          echo "Gefundene App: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Stundenplan.app
          zip -r Stundenplan.ipa Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-IPA
          path: Stundenplan.ipa
