name: Stundenplan bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Xcode anzeigen
        run: xcodebuild -version

      - name: Xcode Projekt erzeugen
        run: |
          swift package generate-xcodeproj || true

      - name: Verfügbare Schemes anzeigen
        run: |
          xcodebuild -list

      - name: App bauen
        run: |
          xcodebuild \
            -scheme "Stundenplan" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            build

      - name: Gebaute Dateien anzeigen
        run: |
          echo "=== Produkte ==="
          find "$GITHUB_WORKSPACE/DerivedData" -type d -name "*.app" -print
          echo "=== Alle Produkte ==="
          find "$GITHUB_WORKSPACE/DerivedData" -type d -path "*/Build/Products/*" -print

      - name: App als IPA verpacken
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "FEHLER: Keine .app gefunden!"
            exit 1
          fi

          echo "Gefundene App:"
          echo "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Stundenplan.ipa Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-IPA
          path: Stundenplan.ipa
