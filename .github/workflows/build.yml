name: Stundenplan bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Xcode anzeigen
        run: xcodebuild -version

      - name: App bauen
        run: |
          xcodebuild \
            -scheme "Stundenplan" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            build

      - name: App als ZIP packen
        run: |
          mkdir -p Payload
          cp -R build/Stundenplan.app Payload/
          zip -r Stundenplan.ipa Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-IPA
          path: Stundenplan.ipa
